; PlatformIO project for M5Stack Cardputer (ESP32-S3)
; Advanced typed-expression scientific calculator

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    https://github.com/azek-dev/cardputer-common.git#v1.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
