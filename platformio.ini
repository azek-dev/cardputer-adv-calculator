; PlatformIO project for M5Stack Cardputer (ESP32-S3)
; Advanced typed-expression scientific calculator

[env:m5stack-stamps3]
; Versions pinned to what the CI build used in September 2026. Unpinned, a
; fresh install pulled espressif32 8.x + M5GFX/M5Unified 0.3.x, and that
; build drew the built-in screen rotated.
platform = espressif32@7.1.3
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.2.23
    m5stack/M5GFX @ 0.2.30
    https://github.com/azek-dev/cardputer-common.git#v1.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
